[project]
name = "deckcraft-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "sqlalchemy>=2.0",
  "pypdfium2>=4.30", "platformdirs>=4.2", "httpx>=0.27", "python-multipart>=0.0.9", "playwright>=1.48", "kokoro-onnx>=0.4", "soundfile>=0.12", "numpy",
]
[project.scripts]
deckcraft = "deckcraft_core.api.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/deckcraft_core"]
[tool.pytest.ini_options]
testpaths = ["tests"]
